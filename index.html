<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Control de Utilities</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --azul:#0B3387;
    --azul-oscuro:#0B2A66;
    --fondo:#F1F5FA;
    --texto:#0B2A66;
    --borde:#DCE4EF;
    --verde:#1f8a4c;
    --verde-fondo:#e6f5ec;
    --rojo:#c0392b;
    --gris:#566680;
    --naranja:#e08a1e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--fondo);
    color:var(--texto);
  }
  .tabs{
    display:flex;
    gap:4px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:1 0 auto;
    white-space:nowrap;
    background:rgba(255,255,255,.12);
    border:none;
    color:#dce8f5;
    font-size:11px;
    font-weight:600;
    cursor:pointer;
    padding:9px 10px;
    border-radius:8px 8px 0 0;
  }
  .tab.activo{
    background:var(--fondo);
    color:var(--azul-oscuro);
  }
  /* Pestaña principal (Equipos Semanal) resaltada para diferenciarla del resto */
  .tab.tab-principal{
    background:var(--naranja);
    color:#fff;
    font-size:12px;
    font-weight:800;
  }
  .tab.tab-principal.activo{
    background:#fff;
    color:var(--naranja);
    box-shadow:inset 0 -3px 0 var(--naranja);
  }
  /* Pestaña Planta (Diario) resaltada en verde */
  .tab.tab-verde{
    background:var(--verde);
    color:#fff;
    font-size:12px;
    font-weight:800;
  }
  .tab.tab-verde.activo{
    background:#fff;
    color:var(--verde);
    box-shadow:inset 0 -3px 0 var(--verde);
  }
  main{
    max-width:560px;
    margin:0 auto;
    padding:16px;
    padding-bottom:40px;
  }
  /* --- Selector de semana/fecha (desglosable) --- */
  .semana-box{
    background:#fff;
    border:1px solid var(--borde);
    border-radius:10px;
    margin-bottom:18px;
    overflow:hidden;
  }
  .semana-resumen{
    padding:14px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
  }
  .semana-resumen .txt{font-size:14.5px;}
  .semana-resumen .txt b{color:var(--azul-oscuro);}
  .semana-resumen .chev{color:var(--gris);font-size:13px;}
  .semana-detalle{
    display:none;
    padding:14px 16px 18px;
    border-top:1px solid var(--borde);
  }
  .semana-detalle.abierto{display:block;}
  .fila-campos{display:flex;gap:10px;margin-top:6px;}
  .fila-campos > div{flex:1;}
  label{font-size:12.5px;color:#5c6975;display:block;margin-bottom:4px;}
  .campo{
    background:#f7f9fb;
    border:1px solid var(--borde);
    border-radius:8px;
    padding:10px 12px;
    width:100%;
    font-size:15px;
  }
  select.campo{-webkit-appearance:none;appearance:none;}
  .btn-aplicar{
    margin-top:14px;
    width:100%;
    padding:11px;
    background:var(--azul);
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  .subtitulo{
    font-size:14px;
    color:#555;
    margin:0 0 10px 2px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .subtitulo-seccion{
    font-size:13px;
    font-weight:700;
    color:var(--azul-oscuro);
    text-transform:uppercase;
    letter-spacing:.03em;
    margin:0 0 10px 2px;
  }
  .link-actualizar{
    font-size:12.5px;
    color:var(--azul);
    cursor:pointer;
    font-weight:600;
    background:none;
    border:none;
    padding:0;
  }
  /* --- Acordeón de líneas --- */
  .linea-box{
    background:#fff;
    border:1px solid var(--borde);
    border-radius:10px;
    margin-bottom:10px;
    overflow:hidden;
  }
  .linea-header{
    padding:14px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    gap:10px;
  }
  .linea-header .nombre{font-size:14px;}
  .linea-header .nombre .num{color:var(--azul-oscuro);font-weight:700;}
  .linea-header .der{display:flex;align-items:center;gap:8px;}
  .badge{
    font-size:11.5px;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    white-space:nowrap;
  }
  .badge.si{background:var(--verde-fondo);color:var(--verde);}
  .badge.no{background:#eef1f4;color:var(--gris);}
  .badge.cargando{background:#eef1f4;color:var(--gris);}
  .chev{color:var(--gris);font-size:13px;}
  .linea-cuerpo{
    display:none;
    padding:4px 16px 18px;
    border-top:1px solid var(--borde);
  }
  .linea-cuerpo.abierto{display:block;}
  .linea-cuerpo .campo{margin-top:10px;font-size:17px;}
  .mensaje-error{color:var(--rojo);font-size:13px;margin-top:8px;}
  .mensaje-ok{color:var(--verde);font-size:13px;margin-top:8px;font-weight:600;}
  .btn-guardar{
    width:100%;
    padding:12px;
    margin-top:12px;
    background:var(--verde);
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
  }
  .btn-guardar[disabled]{opacity:.6;}
  /* --- Consumo: filtros y gráfico --- */
  .filtros-box{
    background:#fff;
    border:1px solid var(--borde);
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:16px;
  }
  .filtros-fila{display:flex;gap:10px;margin-bottom:10px;}
  .filtros-fila:last-child{margin-bottom:0;}
  .filtros-fila > div{flex:1;}
  .grafico-box{
    background:#fff;
    border:1px solid var(--borde);
    border-radius:10px;
    padding:16px 12px;
    margin-bottom:16px;
  }
  .grafico-titulo{font-size:13.5px;color:#5c6975;margin:0 0 10px 4px;overflow:hidden;}
  .card{
    background:#fff;
    border:1px solid var(--borde);
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:10px;
  }
  .card h3{margin:0 0 6px;font-size:15px;}
  .card p{margin:2px 0;font-size:13.5px;color:#3d4a56;}
  .consumo-valor{font-weight:700;color:var(--azul-oscuro);}
  .cargando, .vacio{
    text-align:center;
    color:#777;
    margin-top:40px;
    font-size:14px;
  }
  .spinner{
    width:28px;height:28px;
    border:3px solid #cdd8e2;
    border-top-color:var(--azul);
    border-radius:50%;
    margin:0 auto 10px;
    animation:girar .8s linear infinite;
  }
  @keyframes girar{to{transform:rotate(360deg);}}
  .fila-eliminar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 14px;
    background:#fff;
    border:1px solid var(--borde);
    border-radius:8px;
    margin-bottom:8px;
    font-size:13.5px;
  }
  .fila-eliminar .btn-x{
    background:none;
    border:none;
    color:var(--rojo);
    font-weight:700;
    font-size:13px;
    cursor:pointer;
    padding:4px 6px;
  }
  /* --- Kg Producidos (Semanal) --- */
  .kg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .kg-bloque{
    background:#fff;
    border:1px solid var(--borde);
    border-radius:10px;
    padding:14px 12px 16px;
  }
  .kg-bloque h3{
    font-size:13.5px;
    margin:0 0 8px;
    text-align:center;
    color:var(--azul-oscuro);
  }
  .kg-bloque .estado{text-align:center;margin-bottom:10px;}
  .kg-bloque .campo{font-size:17px;min-width:0;}
  /* --- Análisis: indicadores, tablas y gráficos de líneas --- */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px;}
  .kpi{background:#fff;border:1px solid var(--borde);border-radius:10px;padding:12px 14px;}
  .kpi .et{font-size:12px;color:#5c6975;}
  .kpi .val{font-size:24px;font-weight:700;color:var(--texto);margin:4px 0 2px;}
  .kpi .uni{font-size:13px;font-weight:600;color:#5c6975;margin-left:4px;}
  .kpi-delta{font-size:12px;color:#3d4a56;}
  .kpi-delta.sin{color:var(--gris);}
  .ic{font-size:11px;margin-right:3px;}
  .ic.bueno{color:#0ca30c;}
  .ic.malo{color:#d03b3b;}
  .ic.neutro{color:var(--gris);}
  .kpi .nota{font-size:11.5px;color:var(--gris);margin-top:4px;line-height:1.35;}
  .tabla-scroll{overflow-x:auto;}
  .tabla-var{width:100%;border-collapse:collapse;font-size:13px;}
  .tabla-var th{font-size:11.5px;font-weight:700;color:#5c6975;text-align:right;padding:6px 6px;border-bottom:1px solid var(--borde);white-space:nowrap;}
  .tabla-var th:first-child, .tabla-var td:first-child{text-align:left;}
  .tabla-var td{padding:8px 6px;border-bottom:1px solid #eef1f4;text-align:right;color:var(--texto);font-variant-numeric:tabular-nums;vertical-align:top;}
  .tabla-var td:first-child{font-variant-numeric:normal;}
  .tabla-var td .sub{display:block;font-size:11px;color:var(--gris);}
  .tag-rev{display:inline-block;margin-top:2px;font-size:11px;font-weight:700;color:#7a1f1f;background:#fbeaea;border-radius:10px;padding:1px 7px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 10px;}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--borde);background:#fff;border-radius:20px;padding:5px 10px;font-size:12px;color:#3d4a56;cursor:pointer;}
  .chip .key{width:12px;height:3px;border-radius:2px;background:transparent;border:1px solid #b6c0ca;box-sizing:content-box;}
  .chip.activo{background:#f2f5f8;border-color:#8a97a3;font-weight:600;color:var(--texto);}
  .chip.activo .key{border:none;background:var(--c);height:4px;}
  .lc-wrap{position:relative;}
  .lc-wrap svg{display:block;touch-action:pan-x pan-y;outline:none;}
  .lc-wrap svg:focus-visible{outline:2px solid var(--azul);outline-offset:2px;}
  .lc-tip{position:absolute;top:8px;background:#fff;border:1px solid var(--borde);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);pointer-events:none;z-index:5;min-width:130px;display:none;}
  .lc-tip .t{font-weight:700;color:var(--texto);margin-bottom:4px;}
  .lc-tip .r{display:flex;align-items:center;gap:6px;margin-top:3px;}
  .lc-tip .k{width:12px;height:3px;border-radius:2px;flex:none;}
  .lc-tip .v{font-weight:700;color:var(--texto);}
  .lc-tip .n{color:#5c6975;}
  .lc-leyenda{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:#3d4a56;}
  .lc-leyenda span{display:inline-flex;align-items:center;gap:6px;}
  .lc-leyenda .k{width:12px;height:3px;border-radius:2px;display:inline-block;}
  .nota-chica{font-size:11.5px;color:var(--gris);margin:8px 2px 0;line-height:1.4;}
  /* --- Responsive: celular (por defecto) / tablet / PC --- */
  @media (min-width:700px){
    main{ max-width:760px; padding:22px 24px 48px; }
    .tab{ font-size:13px; padding:12px 10px; }
    .tab.tab-principal, .tab.tab-verde{ font-size:14px; }
    .filtros-fila{ gap:16px; }
    .campo{ font-size:14.5px; }
    .btn-guardar, .btn-aplicar{ width:auto; min-width:220px; }
  }
  @media (min-width:1000px){
    main{ max-width:960px; }
    .filtros-box .filtros-fila{ flex-wrap:nowrap; }
  }
  @media (max-width:360px){
    .tab{ font-size:9.5px; padding:8px 6px; }
    .tab.tab-principal, .tab.tab-verde{ font-size:10.5px; }
    main{ padding:12px; }
  }
  /* =====================================================
     Diseño Control de Utilities (San Fernando)
  ===================================================== */
  button,input,select{font-family:inherit;}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-14px,10px)}}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(223,33,29,.55)}70%{box-shadow:0 0 0 8px rgba(223,33,29,0)}100%{box-shadow:0 0 0 0 rgba(223,33,29,0)}}
  .rise{animation:rise .65s cubic-bezier(.2,.7,.2,1) both;}
  .fade{animation:fade .8s ease both;}
  .ring{animation:drift 14s ease-in-out infinite;}
  .live{animation:pulse 2s ease-out infinite;}

  /* --- Encabezado --- */
  header{
    position:relative;
    overflow:hidden;
    background:#0B3387;
    color:#fff;
  }
  .hd-franja{position:absolute;left:0;top:0;width:100%;background:#DF211D;}
  .hd-anillo{position:absolute;border-radius:50%;}
  .hd-anillo.a1{right:-140px;top:-180px;width:520px;height:520px;border:56px solid rgba(255,255,255,.06);}
  .hd-anillo.a2{right:180px;bottom:-150px;width:300px;height:300px;border:36px solid rgba(223,33,29,.28);animation-delay:-6s;}
  .hd-contenido{position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 32px;}
  .hd-izq{display:flex;flex-wrap:wrap;align-items:center;gap:16px 22px;min-width:0;}
  .hd-logo{background:#fff;display:flex;align-items:center;justify-content:center;flex:none;}
  .hd-logo img{display:block;width:auto;}
  .hd-titulo{display:flex;flex-direction:column;gap:0;min-width:0;}
  .hd-saludo{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:rgba(255,255,255,.88);letter-spacing:.02em;}
  .live{width:8px;height:8px;border-radius:50%;background:#FF4B46;display:inline-block;}
  header h1{margin:0;color:#fff;}
  .hd-reloj{display:flex;flex-direction:column;gap:0;padding:9px 15px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);min-width:168px;}
  .hd-fecha{font-size:12px;font-weight:500;color:rgba(255,255,255,.86);}
  .hd-hora{font-size:23px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .btn-atras{
    display:none;
    align-items:center;
    gap:6px;
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.28);
    color:#fff;
    font-size:13px;
    font-weight:600;
    padding:8px 12px;
    border-radius:10px;
    cursor:pointer;
    white-space:nowrap;
    flex:none;
  }
  .btn-atras:hover{background:rgba(255,255,255,.24);}
  .btn-atras:focus-visible{outline:3px solid #fff;outline-offset:2px;}

  /* Portada (menú principal) */
  header.modo-home{padding:22px 24px 78px;}
  header.modo-home .hd-franja{height:6px;}
  header.modo-home .hd-contenido{max-width:1120px;margin:0 auto;}
  header.modo-home .hd-logo{border-radius:16px;padding:7px 13px;box-shadow:0 8px 22px rgba(4,20,70,.32);}
  header.modo-home .hd-logo img{height:62px;}
  header.modo-home h1{font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.02em;}

  /* Pantallas interiores: encabezado compacto y fijo arriba */
  header.modo-interno{position:sticky;top:0;z-index:10;padding:16px 16px 14px;box-shadow:0 4px 16px rgba(4,20,70,.25);}
  header.modo-interno .hd-franja{height:4px;}
  header.modo-interno .hd-anillo,
  header.modo-interno .hd-reloj,
  header.modo-interno .hd-saludo{display:none;}
  header.modo-interno .btn-atras{display:inline-flex;}
  header.modo-interno .hd-contenido{max-width:960px;margin:0 auto;}
  header.modo-interno .hd-izq{flex-wrap:nowrap;gap:12px;width:100%;}
  header.modo-interno .hd-logo{border-radius:10px;padding:5px 9px;}
  header.modo-interno .hd-logo img{height:34px;}
  header.modo-interno h1{font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.2;}

  /* --- Contenedores del contenido --- */
  main.home{max-width:1120px;margin:-46px auto 0;padding:0 24px 56px;position:relative;}
  main.ancho{max-width:1120px;padding:28px 24px 56px;}

  /* --- Tarjetas del menú --- */
  .grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:20px;}
  .mcard{
    position:relative;
    display:flex;
    flex-direction:column;
    gap:18px;
    min-height:176px;
    box-sizing:border-box;
    padding:24px;
    background:#fff;
    border:1px solid #DCE4EF;
    border-radius:22px;
    box-shadow:0 1px 2px rgba(11,51,135,.06);
    font-family:inherit;
    text-align:left;
    color:inherit;
    cursor:pointer;
    transition:transform .22s cubic-bezier(.2,.7,.2,1),box-shadow .22s,border-color .22s;
  }
  .mcard:hover{transform:translateY(-5px);border-color:var(--c);box-shadow:0 16px 36px rgba(11,51,135,.16);}
  .mcard:active{transform:translateY(-1px) scale(.99);}
  .mcard:focus-visible{outline:3px solid #0B5CAB;outline-offset:3px;}
  .mcard-ico{
    width:60px;height:60px;border-radius:16px;
    background:var(--t);color:var(--c);
    display:flex;align-items:center;justify-content:center;
    transition:transform .25s cubic-bezier(.2,.7,.2,1),background .25s,color .25s;
  }
  .mcard:hover .mcard-ico{transform:scale(1.08) rotate(-5deg);background:var(--c);color:#fff;}
  .mcard-txt{display:flex;flex-direction:column;gap:4px;margin-top:auto;align-items:flex-start;}
  .mcard .nombre{font-size:20px;font-weight:700;color:#0B2A66;letter-spacing:-.01em;}
  .mcard .desc{font-size:14px;font-weight:500;color:#566680;}
  .mcard-go{
    position:absolute;top:22px;right:22px;width:36px;height:36px;border-radius:50%;
    background:#EEF3FB;color:#0B3387;
    display:flex;align-items:center;justify-content:center;
    transition:background .2s,color .2s,transform .2s;
  }
  .mcard:hover .mcard-go{background:var(--c);color:#fff;transform:translateX(3px);}
  .mcard.off{background:#FAFBFD;border:1px dashed #C9D3E2;cursor:not-allowed;}
  .mcard.off:hover{transform:none;border-color:#C9D3E2;box-shadow:0 1px 2px rgba(11,51,135,.06);}
  .mcard.off:hover .mcard-ico{transform:none;background:var(--t);color:var(--c);}
  .badge-prox{font-size:12px;font-weight:700;color:#4A5568;background:#E6EAF0;border-radius:999px;padding:4px 10px;letter-spacing:.02em;margin-top:2px;}

  /* --- Cajas de las pantallas interiores, con el mismo lenguaje --- */
  .semana-box,.linea-box,.filtros-box,.grafico-box,.kpi,.archivo-fila{
    border-radius:16px;
    box-shadow:0 1px 2px rgba(11,51,135,.06);
  }
  .aviso{
    background:#FFF6E5;
    border:1px solid #F0D9A8;
    color:#7A5410;
    border-radius:14px;
    padding:12px 14px;
    font-size:13px;
    margin-bottom:14px;
    line-height:1.4;
    position:relative;
  }
  .toast{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%) translateY(20px);
    max-width:min(92vw,520px);
    background:#0B2A66;
    color:#fff;
    font-size:13px;
    padding:11px 16px;
    border-radius:12px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s, transform .2s;
    z-index:50;
  }
  .toast.visible{opacity:1;transform:translateX(-50%) translateY(0);}
  .archivo-fila{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:12px 14px;
    background:#fff;
    border:1px solid var(--borde);
    margin-bottom:8px;
  }

    header.modo-home h1{font-size:22px;}
    header.modo-home .hd-reloj{display:none;}
    main.home{padding:0 16px 40px;margin-top:-38px;}
    main.ancho{padding:20px 16px 40px;}
    .mcard{min-height:150px;padding:20px;}
    header.modo-interno h1{font-size:16px;}
  }
  @media (max-width:380px){
    header.modo-interno .hd-logo{display:none;}
  }
  @media (prefers-reduced-motion:reduce){
    .rise,.fade,.ring,.live{animation:none;}
    .mcard,.mcard-ico,.mcard-go{transition:none;}
  }
</style>

function formatearFechaDMA(fechaISO){
  // "2026-07-30" -> "30/07/2026"
  if (!fechaISO) return "";
  const partes = String(fechaISO).slice(0,10).split("-");
  if (partes.length !== 3) return fechaISO;
  return `${partes[2]}/${partes[1]}/${partes[0]}`;
}
function formatearMesDMA(mesISO){
  // "2026-07" -> "07/2026"
  if (!mesISO) return "";
  const partes = String(mesISO).split("-");
  if (partes.length !== 2) return mesISO;
  return `${partes[1]}/${partes[0]}`;
}
function getISOWeek(date){
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}
// Fecha de hoy en hora LOCAL (toISOString usaría UTC y desde las 7 pm de Lima daría el día siguiente).
function hoyISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function semanaDeFecha(iso){
  const p = String(iso).split("-").map(Number);
  return getISOWeek(new Date(p[0], p[1] - 1, p[2]));
}
let toastTimer = null;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("visible");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("visible"), 6000);
}

// Trae TODAS las filas de una tabla (Supabase entrega máximo 1000 por consulta).
async function traerTodo(tabla, columnas, orden){
  const filas = [];
  const paso = 1000;
  for (let desde = 0; ; desde += paso){
    let q = sb.from(tabla).select(columnas);
    orden.forEach(c => { q = q.order(c, { ascending: true }); });
    const { data, error } = await q.range(desde, desde + paso - 1);
    if (error) throw new Error(error.message);
    filas.push(...data);
    if (data.length < paso) break;
  }
  return filas;
}
async function obtenerLineasDesdeBackend(tipo){
  try{
    const { data, error } = await sb.from("lineas").select("medidor_num,nombre").eq("tipo", tipo).order("medidor_num");
    if (error) throw new Error(error.message);
    return data.map(l => ({ medidorNum: Number(l.medidor_num), nombre: String(l.nombre) }));
  }catch(e){
    toast("No se pudieron cargar las líneas: " + e.message);
    return [];
  }
}
async function cargarLineas(){
  lineasGlobal = await obtenerLineasDesdeBackend("semanal");
}

}
// consumo(punto N) = lectura(N) - lectura(N-1). El primer punto registrado no tiene consumo (null).
// "semanal" encadena por semana; "diario", por fecha.
function construirHistorial(tipo, lineas, filas){
  const porMedidor = {};
  filas.forEach(r => {
    const m = Number(r.medidor_num);
    if (!porMedidor[m]) porMedidor[m] = [];
    porMedidor[m].push({ fecha: String(r.fecha).slice(0, 10), semana: Number(r.semana), lectura: Number(r.lectura) });
  });
  const hist = {};
  Object.keys(porMedidor).forEach(k => {
    const puntos = porMedidor[k].sort((a, b) => {
      if (tipo === "diario") return a.fecha < b.fecha ? -1 : (a.fecha > b.fecha ? 1 : 0);
      return a.semana - b.semana;
    });
    hist[k] = puntos.map((p, i) => {
      const ant = puntos[i - 1];
      return { semana: p.semana, fecha: p.fecha, lectura: p.lectura, consumo: ant ? Number((p.lectura - ant.lectura).toFixed(2)) : null };
    });
  });
  if (tipo === "semanal"){
    Object.keys(RESTAS_ESPECIALES).forEach(k => {
      const medidor = Number(k);
      const consumoPorSemana = {};
      (hist[RESTAS_ESPECIALES[k]] || []).forEach(p => { consumoPorSemana[p.semana] = p.consumo; });
      hist[medidor] = (hist[medidor] || []).map(p => {
        const c = consumoPorSemana[p.semana];
        const ajustado = (p.consumo !== null && c !== null && c !== undefined) ? Number((p.consumo - c).toFixed(2)) : null;
        return { semana: p.semana, fecha: p.fecha, lectura: p.lectura, consumo: ajustado };
      });
    });
  }
  return lineas.map(l => ({ medidorNum: l.medidorNum, nombre: l.nombre, historial: hist[l.medidorNum] || [] }));
}
async function cargarConsumoSemanal(){
  const filas = await traerTodo("lecturas_semanales", "medidor_num,semana,fecha,lectura", ["medidor_num", "semana"]);
  consumoGlobal = construirHistorial("semanal", lineasGlobal, filas);
}

/* --- Reloj de la portada (hora de Lima) --- */
function pintarReloj(){
  const d = new Date();
  const tz = "America/Lima";
  let fecha = new Intl.DateTimeFormat("es-PE", { weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: tz }).format(d);
  fecha = fecha.charAt(0).toUpperCase() + fecha.slice(1);
  const hora = new Intl.DateTimeFormat("es-PE", { hour: "2-digit", minute: "2-digit", hour12: true, timeZone: tz }).format(d);
  document.getElementById("fechaTxt").textContent = fecha;
  document.getElementById("horaTxt").textContent = hora;
}

// o: { vista, icono, c (color), f (fondo del ícono), nombre, desc, off }
function tarjeta(o, delay){
  const estilo = `--c:${o.c};--t:${o.f};animation-delay:${delay.toFixed(2)}s`;
  if (o.off){
    return `
    <button type="button" class="mcard off rise" disabled aria-disabled="true" style="${estilo}">
      <span class="mcard-ico">${svgIcono(o.icono)}</span>
      <span class="mcard-txt"><span class="nombre">${o.nombre}</span><span class="badge-prox">Próximamente</span></span>
    </button>`;
  }
  return `
    <button type="button" class="mcard rise" onclick="irA('${o.vista}')" style="${estilo}">
      <span class="mcard-ico">${svgIcono(o.icono)}</span>
      <span class="mcard-txt"><span class="nombre">${o.nombre}</span><span class="desc">${o.desc}</span></span>
      <span class="mcard-go" aria-hidden="true">${FLECHA}</span>
    </button>`;
}

async function renderRegistro(){

    app.innerHTML = `<div class="cargando"><div class="spinner"></div>Cargando líneas...</div>`;
    await cargarLineas();
    if (vistaActual !== "agua_equipos") return;
  }
  const yaEnCache = Object.prototype.hasOwnProperty.call(cacheLecturasPorSemana, semanaActual);
  lecturasSemana = yaEnCache ? cacheLecturasPorSemana[semanaActual] : {};
  app.innerHTML = `
    <div class="semana-box">
      <div class="semana-resumen" onclick="toggleSemana()">
        <div class="txt">Semana <b>${semanaActual}</b> — ${formatearFechaDMA(fechaActual)}</div>
        <div class="chev">${semanaAbierta ? "▲ cambiar" : "▼ cambiar"}</div>
      </div>
      <div class="semana-detalle ${semanaAbierta ? "abierto" : ""}">
        <div class="fila-campos">
          <div>
            <label>Número de semana</label>
            <input id="inputSemana" class="campo" type="number" min="1" max="53" value="${semanaActual}">
          </div>
          <div>
            <label>Fecha</label>
            <input id="inputFecha" class="campo" type="date" value="${fechaActual}">
          </div>
        </div>
        <button class="btn-aplicar" onclick="aplicarSemana()">Aplicar</button>
      </div>
    </div>
    <p class="subtitulo">
      <span>Líneas / medidores:</span>
      <button class="link-actualizar" onclick="refrescarSemanaActual()">↻ actualizar</button>
    </p>
    <div id="listaLineas"></div>
  `;
  renderListaLineas(!yaEnCache);
  if (!yaEnCache){
    const ok = await cargarLecturasSemana();
    if (vistaActual !== "agua_equipos") return;
    if (ok) cacheLecturasPorSemana[semanaActual] = lecturasSemana;
    renderListaLineas(false);
  }
}
function toggleSemana(){
  semanaAbierta = !semanaAbierta;
  renderRegistro();
}
async function aplicarSemana(){
  const nSemana = parseInt(document.getElementById("inputSemana").value, 10);
  const nFecha = document.getElementById("inputFecha").value;
  if (isNaN(nSemana) || nSemana < 1 || nSemana > 53){
    alert("Ingresa un número de semana válido (1-53).");
    return;
  }
  semanaActual = nSemana;
  fechaActual = nFecha || fechaActual;
  semanaAbierta = false;
  lineaAbierta = null;
  await renderRegistro();
}
async function refrescarSemanaActual(){
  delete cacheLecturasPorSemana[semanaActual];
  await renderRegistro();
}
async function cargarLecturasSemana(){
  try{
    const { data, error } = await sb.from("lecturas_semanales").select("medidor_num,lectura").eq("semana", semanaActual);
    if (error) throw new Error(error.message);
    lecturasSemana = {};
    data.forEach(r => { lecturasSemana[Number(r.medidor_num)] = Number(r.lectura); });
    return true;
  }catch(e){
    lecturasSemana = {};
    toast("No se pudieron cargar las lecturas: " + e.message);
    return false;
  }
}
function renderListaLineas(cargandoEstado){
  const cont = document.getElementById("listaLineas");
  cont.innerHTML = "";
  if (!lineasGlobal.length){
    cont.innerHTML = `<div class="vacio">No se pudieron cargar las líneas. Revisa la conexión con Supabase y que las tablas estén creadas.</div>`;
    return;
  }
  lineasGlobal.forEach(l => {
    const medidorNum = l.medidorNum;
    const yaRegistrado = Object.prototype.hasOwnProperty.call(lecturasSemana, medidorNum);
    const valorActual = yaRegistrado ? lecturasSemana[medidorNum] : "";
    const abierto = lineaAbierta === medidorNum;
    let badgeClase = "no", badgeTexto = "Sin registrar";
    if (cargandoEstado){ badgeClase = "cargando"; badgeTexto = "..."; }
    else if (yaRegistrado){ badgeClase = "si"; badgeTexto = "Ya registrado"; }
    const box = document.createElement("div");
    box.className = "linea-box";
    box.innerHTML = `
      <div class="linea-header" onclick="toggleLinea(${medidorNum})">
        <span class="nombre"><span class="num">MEDIDOR ${medidorNum}</span> — ${l.nombre}</span>
        <span class="der">
          <span class="badge ${badgeClase}">${badgeTexto}</span>
          <span class="chev">${abierto ? "▲" : "▼"}</span>
        </span>
      </div>
      <div class="linea-cuerpo ${abierto ? "abierto" : ""}">
        <label>Lectura del medidor${yaRegistrado ? " (editar)" : ""}</label>
        <input class="campo input-lectura" type="number" inputmode="decimal" step="any"
               placeholder="Ej: 8607.09" value="${valorActual}">
        <div class="mensaje-error"></div>
        <button class="btn-guardar">${yaRegistrado ? "Actualizar lectura" : "Guardar lectura"}</button>
      </div>
    `;
    const btnGuardar = box.querySelector(".btn-guardar");
    btnGuardar.onclick = () => guardarLectura(medidorNum, box);
    cont.appendChild(box);
  });
}
function toggleLinea(medidorNum){
  lineaAbierta = (lineaAbierta === medidorNum) ? null : medidorNum;
  renderListaLineas(false);
}
async function guardarLectura(medidorNum, box){
  const input = box.querySelector(".input-lectura");
  const errorDiv = box.querySelector(".mensaje-error");
  const btn = box.querySelector(".btn-guardar");
  const valor = parseFloat(String(input.value).replace(",", "."));
  if (isNaN(valor)){
    errorDiv.textContent = "Ingresa un número válido.";
    return;
  }
  errorDiv.textContent = "";
  btn.disabled = true;
  const textoOriginal = btn.textContent;
  btn.textContent = "Guardando...";
  try{
    const { error } = await sb.from("lecturas_semanales").upsert(
      { medidor_num: medidorNum, semana: semanaActual, fecha: fechaActual, lectura: valor },
      { onConflict: "medidor_num,semana" });
    if (error) throw new Error(error.message);
    lecturasSemana[medidorNum] = valor;
    cacheLecturasPorSemana[semanaActual] = lecturasSemana;
    consumoGlobal = null; // los datos de consumo quedaron desactualizados
    lineaAbierta = null;
    renderListaLineas(false);
  }catch(e){
    btn.disabled = false;
    btn.textContent = textoOriginal;
    errorDiv.textContent = "No se pudo guardar: " + e.message;
  }
}
/* =========================================================
   PANTALLA: Kg Producidos (Semanal) — Embutidos y Empacado
   Se elige UNA semana arriba y se ingresan los kg de Embutidos
   y de Empacado de esa semana. Si ya había datos, aparecen en
   las casillas para poder editarlos.
========================================================= */
const KG_PRODUCTOS = [
  { clave: "embutidos", titulo: "Kg producidos “Embutidos”" },
  { clave: "empacado",  titulo: "Kg producidos “Empacado”" }
];
function kgRegistrado(clave, semana){
  return Object.prototype.hasOwnProperty.call(kgGlobal[clave], semana);
}
async function cargarKg(){
  try{
    const filas = await traerTodo("kg_producidos", "semana,producto,kg", ["semana", "producto"]);
    kgGlobal = { embutidos: {}, empacado: {} };
    filas.forEach(f => { if (kgGlobal[f.producto]) kgGlobal[f.producto][Number(f.semana)] = Number(f.kg); });
    return true;
  }catch(e){
    kgGlobal = null;
    return e.message;
  }
}
function maxSemanaKg(){
  let max = 0;
  KG_PRODUCTOS.forEach(p => Object.keys(kgGlobal[p.clave]).forEach(s => { if (Number(s) > max) max = Number(s); }));
  return max;
}
async function renderKg(){
  if (kgGlobal === null){
    app.innerHTML = `<div class="cargando"><div class="spinner"></div>Cargando...</div>`;
    const r = await cargarKg();
    if (vistaActual !== "kg") return;
    if (r !== true){
      app.innerHTML = `<div class="mensaje-error" style="margin-top:40px;text-align:center;">No se pudo cargar: ${r}</div>`;
      return;
    }
  }
  // Por defecto se propone la semana siguiente a la última con datos.
  if (kgSemana === null){ const m = maxSemanaKg(); kgSemana = m > 0 ? m + 1 : semanaActual; }
  pintarKg();
}

/* =========================================================
   PANTALLA: Energía — carga de archivo Excel
   El archivo se guarda en el Storage de Supabase (bucket
   "energia") y queda registrado en la tabla energia_archivos.
========================================================= */
const MAX_MB_ENERGIA = 20;

function nombreSeguro(nombre){
  return String(nombre).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9._-]/g, "_");
}
function formatearTamano(bytes){
  const b = Number(bytes);
  if (!b) return "";
  return b >= 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB";
}
async function renderEnergia(){
  app.innerHTML = `
    <p class="subtitulo">Sube el archivo Excel con los consumos de energía.</p>
    <div class="linea-box">
      <div style="padding:16px;">
        <label>Archivo (.xlsx, .xls o .csv · máx. ${MAX_MB_ENERGIA} MB)</label>
        <input id="inputArchivoEnergia" class="campo" type="file" accept=".xlsx,.xls,.csv">
        <div id="errorEnergia" class="mensaje-error"></div>
        <div id="okEnergia" class="mensaje-ok"></div>
        <button class="btn-guardar" id="btnSubirEnergia">Subir archivo</button>
      </div>
    </div>
    <p class="subtitulo-seccion" style="margin-top:26px;">Archivos cargados</p>
    <div id="listaEnergia"><div class="cargando"><div class="spinner"></div>Cargando...</div></div>
  `;
  document.getElementById("btnSubirEnergia").onclick = subirArchivoEnergia;
  await cargarArchivosEnergia();
}
async function cargarArchivosEnergia(){
  let filas = [];
  let errorMsg = null;
  try{
    const { data, error } = await sb.from("energia_archivos").select("id,created_at,nombre,ruta,tamano").order("created_at", { ascending: false });
    if (error) throw new Error(error.message);
    filas = data;
  }catch(e){
    errorMsg = e.message;
  }
  if (vistaActual !== "energia") return;
  const cont = document.getElementById("listaEnergia");
  if (errorMsg){
    cont.innerHTML = `<div class="mensaje-error">No se pudo cargar la lista: ${esc(errorMsg)}</div>`;
    return;
  }
  if (!filas.length){
    cont.innerHTML = `<div class="vacio" style="margin-top:10px;">Todavía no se ha subido ningún archivo.</div>`;
    return;
  }
  cont.innerHTML = "";
  filas.forEach(f => {
    const fila = document.createElement("div");
    fila.className = "archivo-fila";
    const info = document.createElement("div");
    info.className = "archivo-info";
    const nom = document.createElement("div");
    nom.className = "archivo-nombre";
    nom.textContent = f.nombre;
    const meta = document.createElement("div");
    meta.className = "archivo-meta";
    meta.textContent = new Date(f.created_at).toLocaleString("es-PE") + (f.tamano ? " · " + formatearTamano(f.tamano) : "");
    info.appendChild(nom);
    info.appendChild(meta);
    const acciones = document.createElement("div");
    acciones.className = "archivo-acciones";
    const bDesc = document.createElement("button");
    bDesc.className = "link-actualizar";
    bDesc.textContent = "Descargar";
    bDesc.onclick = () => descargarArchivoEnergia(f);
    const bDel = document.createElement("button");
    bDel.className = "btn-x";
    bDel.textContent = "Eliminar";
    bDel.onclick = () => eliminarArchivoEnergia(f);
    acciones.appendChild(bDesc);
    acciones.appendChild(bDel);
    fila.appendChild(info);
    fila.appendChild(acciones);
    cont.appendChild(fila);
  });
}
async function subirArchivoEnergia(){
  const input = document.getElementById("inputArchivoEnergia");
  const errorDiv = document.getElementById("errorEnergia");
  const okDiv = document.getElementById("okEnergia");
  const btn = document.getElementById("btnSubirEnergia");
  okDiv.textContent = "";
  const f = input.files && input.files[0];
  if (!f){
    errorDiv.textContent = "Elige un archivo primero.";
    return;
  }
  if (!/\.(xlsx|xls|csv)$/i.test(f.name)){
    errorDiv.textContent = "El archivo debe ser Excel (.xlsx, .xls) o .csv.";
    return;
  }
  if (f.size > MAX_MB_ENERGIA * 1048576){
    errorDiv.textContent = `El archivo supera los ${MAX_MB_ENERGIA} MB.`;
    return;
  }
  errorDiv.textContent = "";
  btn.disabled = true;
  btn.textContent = "Subiendo...";
  const ruta = `${Date.now()}_${nombreSeguro(f.name)}`;
  let subido = false;
  try{
    const up = await sb.storage.from(BUCKET_ENERGIA).upload(ruta, f, { contentType: f.type || "application/octet-stream", upsert: false });
    if (up.error) throw new Error(up.error.message);
    subido = true;
    const ins = await sb.from("energia_archivos").insert({ nombre: f.name, ruta, tamano: f.size });
    if (ins.error) throw new Error(ins.error.message);
    if (vistaActual !== "energia") return;
    input.value = "";
    okDiv.textContent = `✓ "${f.name}" subido.`;
    await cargarArchivosEnergia();
  }catch(e){
    if (subido){ try{ await sb.storage.from(BUCKET_ENERGIA).remove([ruta]); }catch(_){} }
    if (vistaActual === "energia") errorDiv.textContent = "No se pudo subir: " + e.message;
  }finally{
    if (vistaActual === "energia"){
      btn.disabled = false;
      btn.textContent = "Subir archivo";
    }
  }
}
async function descargarArchivoEnergia(f){
  try{
    const { data, error } = await sb.storage.from(BUCKET_ENERGIA).createSignedUrl(f.ruta, 120, { download: f.nombre });
    if (error) throw new Error(error.message);
    const a = document.createElement("a");
    a.href = data.signedUrl;
    a.download = f.nombre;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }catch(e){
    toast("No se pudo descargar: " + e.message);
  }
}
async function eliminarArchivoEnergia(f){
  if (!confirm(`¿Eliminar "${f.nombre}"? Esta acción no se puede deshacer.`)) return;
  try{
    const rm = await sb.storage.from(BUCKET_ENERGIA).remove([f.ruta]);
    if (rm.error) throw new Error(rm.error.message);
    const del = await sb.from("energia_archivos").delete().eq("id", f.id);
    if (del.error) throw new Error(del.error.message);
    await cargarArchivosEnergia();
  }catch(e){
    toast("No se pudo eliminar: " + e.message);
  }
}

        <button class="btn-guardar">${yaRegistrado ? "Actualizar lectura" : "Guardar lectura"}</button>
      </div>
    `;
    const btnGuardar = box.querySelector(".btn-guardar");
    btnGuardar.onclick = () => guardarLecturaDiario(medidorNum, box);
    cont.appendChild(box);
  });
}
function toggleLineaDiario(medidorNum){
  lineaDiarioAbierta = (lineaDiarioAbierta === medidorNum) ? null : medidorNum;
  renderListaDiario(false);
}
async function guardarLecturaDiario(medidorNum, box){
  const input = box.querySelector(".input-lectura");
  const errorDiv = box.querySelector(".mensaje-error");
  const btn = box.querySelector(".btn-guardar");
  const valor = parseFloat(String(input.value).replace(",", "."));
  if (isNaN(valor)){
    errorDiv.textContent = "Ingresa un número válido.";
    return;
  }
  errorDiv.textContent = "";
  btn.disabled = true;
  const textoOriginal = btn.textContent;
  btn.textContent = "Guardando...";
  try{
    const { error } = await sb.from("lecturas_diarias").upsert(
      { medidor_num: medidorNum, fecha: fechaDiarioActual, semana: semanaDeFecha(fechaDiarioActual), lectura: valor },
      { onConflict: "medidor_num,fecha" });
    if (error) throw new Error(error.message);
    lecturasDiario[medidorNum] = valor;
    cacheLecturasPorFecha[fechaDiarioActual] = lecturasDiario;
    consumoDiarioGlobal = null;
    lineaDiarioAbierta = null;
    renderListaDiario(false);
  }catch(e){
    btn.disabled = false;
    btn.textContent = textoOriginal;
    errorDiv.textContent = "No se pudo guardar: " + e.message;
  }
}
/* =========================================================
   PANTALLA: Análisis (Equipos Semanal + Planta Diario)
========================================================= */
async function renderAnalisis(){
  app.innerHTML = `<div class="cargando"><div class="spinner"></div>Cargando datos...</div>`;
  try{
    await Promise.all([
      lineasGlobal.length ? null : cargarLineas(),
      lineasDiarioGlobal.length ? null : cargarLineasDiario()
    ]);
    await Promise.all([
      consumoGlobal !== null ? null : cargarConsumoSemanal(),
      consumoDiarioGlobal !== null ? null : cargarConsumoDiario().catch(e => {
        consumoDiarioGlobal = [];
        toast("No se pudo cargar el consumo diario: " + e.message);
      }),
      kgGlobal !== null ? null : cargarKg().then(r => {
        if (r !== true) toast("No se pudieron cargar los kg producidos: " + r);
      })
    ]);
  }catch(e){
    if (vistaActual !== "dashboard") return;
    app.innerHTML = `<div class="mensaje-error" style="margin-top:40px;text-align:center;">No se pudo cargar: ${esc(e.message)}</div>`;
    return;
  }
  if (vistaActual !== "dashboard") return;
  renderPantallaAnalisis();
}
async function refrescarAnalisis(){
  consumoGlobal = null;
  consumoDiarioGlobal = null;
  kgGlobal = null;
  await renderAnalisis();
}
function renderPantallaAnalisis(){
  app.innerHTML = construirResumen() + construirSeccionEquipos() + construirSeccionDiario();
  activarResumen();

  if (document.getElementById("selLinea")){
    const semanas = obtenerSemanasDisponibles();
    const meses = obtenerMesesDisponibles();
    document.getElementById("selLinea").onchange = (e) => {
      filtroLinea = e.target.value;
      dibujarGrafico();
      dibujarPareto();
    };
    document.getElementById("selTipo").onchange = (e) => {
      filtroTipo = e.target.value;
      filtroValor = filtroTipo === "semana" ? (semanas[0] || null) : (meses[0] || null);
      renderPantallaAnalisis();
    };
    document.getElementById("selValor").onchange = (e) => {
      filtroValor = filtroTipo === "semana" ? Number(e.target.value) : e.target.value;
      dibujarGrafico();
      dibujarPareto();
    };
    dibujarGrafico();
    dibujarPareto();
  }

  if (document.getElementById("selMedicionDiario")){
    document.getElementById("selMedicionDiario").onchange = (e) => {
      filtroDiarioMedicion = e.target.value;
      dibujarGraficoDiario();
    };
    document.getElementById("selMesDiario").onchange = (e) => {
      filtroDiarioMes = e.target.value;
      dibujarGraficoDiario();
    };
    dibujarGraficoDiario();
  }
}
/* --- Sección Equipos (Semanal): filtros + barras + Pareto --- */
function construirSeccionEquipos(){
  if (!consumoGlobal.length || consumoGlobal.every(l => !l.historial.length)) {
    return `

      <div class="vacio" style="margin-bottom:26px;">Todavía no hay lecturas registradas.</div>

  const semanas = obtenerSemanasDisponibles();
  const meses = obtenerMesesDisponibles();
  if (filtroValor === null){
    filtroValor = filtroTipo === "semana" ? (semanas[0] || null) : (meses[0] || null);
  }
  return `
    <p class="subtitulo-seccion">Equipos (Semanal)</p>

        <div>

          </select>
        </div>

          <label>${filtroTipo==="semana" ? "Semana" : "Mes"}</label>
          <select id="selValor" class="campo">
            ${filtroTipo==="semana"
              ? semanas.map(s => `<option value="${s}" ${filtroValor==s?"selected":""}>Semana ${s}</option>`).join("")
              : meses.map(m => `<option value="${m}" ${filtroValor===m?"selected":""}>${formatearMesDMA(m)}</option>`).join("")}

    </div>

}
async function toggleOrden(){
  ordenGrafico = ordenGrafico === "desc" ? "asc" : "desc";
  dibujarGrafico();
}
function obtenerSemanasDisponibles(){
  const set = new Set();
  consumoGlobal.forEach(l => l.historial.forEach(p => set.add(p.semana)));
  return Array.from(set).sort((a,b) => b - a);
}
function obtenerMesesDisponibles(){
  const set = new Set();
  consumoGlobal.forEach(l => l.historial.forEach(p => {
    if (p.consumo !== null && p.fecha) set.add(String(p.fecha).slice(0,7));
  }));
  return Array.from(set).sort().reverse();
}
function calcularDatosGrafico(){
  const items = [];
  if (filtroLinea === ""){
    consumoGlobal.forEach(l => {
      let valor = 0;
      l.historial.forEach(p => {
        if (p.consumo === null) return;
        if (filtroTipo === "semana"){
          if (p.semana === filtroValor) valor += p.consumo;
        }else{
          if (String(p.fecha).slice(0,7) === filtroValor) valor += p.consumo;
        }
      });
      items.push({ label: `M${l.medidorNum} ${l.nombre}`, valor: Number(valor.toFixed(2)) });
    });
    items.sort((a, b) => ordenGrafico === "desc" ? b.valor - a.valor : a.valor - b.valor);
  }else{
    const linea = consumoGlobal.find(l => String(l.medidorNum) === String(filtroLinea));
    if (!linea) return [];
    if (filtroTipo === "semana"){
      linea.historial.filter(p => p.consumo !== null).forEach(p => {
        items.push({ label: `Sem ${p.semana}`, valor: p.consumo });
      });
    }else{
      const porMes = {};
      linea.historial.filter(p => p.consumo !== null).forEach(p => {
        const mes = String(p.fecha).slice(0,7);
        porMes[mes] = (porMes[mes] || 0) + p.consumo;
      });
      Object.keys(porMes).sort().forEach(mes => {
        items.push({ label: formatearMesDMA(mes), valor: Number(porMes[mes].toFixed(2)) });
      });
    }
  }
  return items;
}
function dibujarGrafico(){
  const items = calcularDatosGrafico();
  const linea = filtroLinea === "" ? null : lineasGlobal.find(l => String(l.medidorNum) === String(filtroLinea));
  const tituloSpan = document.getElementById("graficoTitulo");
  const btnOrden = document.getElementById("btnOrden");
  if (filtroLinea === ""){
    tituloSpan.textContent = `Consumo por línea — ${filtroTipo === "semana" ? "Semana " + filtroValor : formatearMesDMA(filtroValor)} (eje Y: m³)`;
    btnOrden.style.display = "inline";
    btnOrden.textContent = ordenGrafico === "desc" ? "↓ mayor a menor" : "↑ menor a mayor";
  }else{
    tituloSpan.textContent = `Consumo de MEDIDOR ${linea ? linea.medidorNum : ""} — ${linea ? linea.nombre : ""} (eje Y: m³)`;
    btnOrden.style.display = "none";
  }
  renderBarChart(document.getElementById("grafico"), items);
}
function renderBarChart(container, items){
  if (!items.length){
    container.innerHTML = `<div class="vacio">No hay datos para este filtro.</div>`;
    return;
  }
  const max = Math.max(...items.map(i => i.valor), 1);
  const anchoBarra = 46;
  const espacio = 22;
  const alturaMax = 200;
  const anchoSvg = items.length * (anchoBarra + espacio) + espacio;
  const altoSvg = alturaMax + 110;
  let barrasSvg = "";
  items.forEach((item, idx) => {
    const x = espacio + idx * (anchoBarra + espacio);
    const alturaBarra = Math.max(2, (item.valor / max) * alturaMax);
    const y = alturaMax - alturaBarra + 20;
    const xCentro = x + anchoBarra / 2;
    const yEtiqueta = alturaMax + 26;
    barrasSvg += `
      <rect x="${x}" y="${y}" width="${anchoBarra}" height="${alturaBarra}" rx="4" fill="#0b5cab"></rect>
      <text x="${xCentro}" y="${y - 6}" text-anchor="middle" font-size="11" fill="#083d73" font-weight="700">${item.valor}</text>
      <text x="${xCentro}" y="${yEtiqueta}" text-anchor="end" font-size="10" fill="#5c6975" transform="rotate(-45 ${xCentro} ${yEtiqueta})">${item.label}</text>
    `;
  });
  container.innerHTML = `
    <div style="overflow-x:auto;">
      <svg width="${anchoSvg}" height="${altoSvg}" viewBox="0 0 ${anchoSvg} ${altoSvg}">
        <line x1="${espacio-6}" y1="${alturaMax+20}" x2="${anchoSvg-4}" y2="${alturaMax+20}" stroke="#d7dee5" />
        ${barrasSvg}
      </svg>
    </div>
  `;
}
/* --- Pareto (solo cuando se comparan "Todas las líneas") --- */

  const box = document.getElementById("paretoBox");

}
function renderParetoChart(container, items){
  if (!items.length){
    container.innerHTML = `<div class="vacio">No hay datos para este filtro.</div>`;
    return;
  }
  const total = items.reduce((s, i) => s + i.valor, 0) || 1;
  let acumulado = 0;
  const pct = items.map(i => { acumulado += i.valor; return Number((acumulado / total * 100).toFixed(1)); });

  const max = Math.max(...items.map(i => i.valor), 1);
  const anchoBarra = 46;
  const espacio = 22;
  const alturaMax = 200;
  const anchoSvg = items.length * (anchoBarra + espacio) + espacio;
  const altoSvg = alturaMax + 110;

  let barrasSvg = "";
  const puntosLinea = [];
  items.forEach((item, idx) => {
    const x = espacio + idx * (anchoBarra + espacio);
    const alturaBarra = Math.max(2, (item.valor / max) * alturaMax);
    const y = alturaMax - alturaBarra + 20;
    const xCentro = x + anchoBarra / 2;
    const yEtiqueta = alturaMax + 26;
    barrasSvg += `
      <rect x="${x}" y="${y}" width="${anchoBarra}" height="${alturaBarra}" rx="4" fill="#0b5cab"></rect>
      <text x="${xCentro}" y="${y - 6}" text-anchor="middle" font-size="10" fill="#083d73" font-weight="700">${item.valor}</text>
      <text x="${xCentro}" y="${yEtiqueta}" text-anchor="end" font-size="10" fill="#5c6975" transform="rotate(-45 ${xCentro} ${yEtiqueta})">${item.label}</text>
    `;
    const yPct = 20 + alturaMax - (pct[idx] / 100) * alturaMax;
    puntosLinea.push([xCentro, yPct]);
  });
  const yLinea80 = 20 + alturaMax - 0.8 * alturaMax;
  const lineaSvg = `
    <polyline points="${puntosLinea.map(p => p.join(",")).join(" ")}" fill="none" stroke="#e08a1e" stroke-width="2"></polyline>
    ${puntosLinea.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#e08a1e"></circle>`).join("")}
    <line x1="${espacio-6}" y1="${yLinea80}" x2="${anchoSvg-4}" y2="${yLinea80}" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="5,4"></line>
    <text x="${anchoSvg-6}" y="${yLinea80-4}" text-anchor="end" font-size="9" fill="#c0392b">80%</text>
  `;
  container.innerHTML = `
    <div style="overflow-x:auto;">
      <svg width="${anchoSvg}" height="${altoSvg}" viewBox="0 0 ${anchoSvg} ${altoSvg}">
        <line x1="${espacio-6}" y1="${alturaMax+20}" x2="${anchoSvg-4}" y2="${alturaMax+20}" stroke="#d7dee5" />
        ${barrasSvg}
        ${lineaSvg}
      </svg>
    </div>
    <div style="margin-top:8px;font-size:11.5px;color:#5c6975;">
      <span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;"><span style="width:10px;height:10px;background:#0b5cab;display:inline-block;border-radius:2px;"></span>Consumo (m³)</span>
      <span style="display:inline-flex;align-items:center;gap:5px;"><span style="width:10px;height:10px;background:#e08a1e;display:inline-block;border-radius:2px;"></span>% acumulado</span>
    </div>
  `;
}

function renderBarChartDiario(container, fechas, series){
  if (!fechas.length || !series.length){
    container.innerHTML = `<div class="vacio">No hay datos para este filtro.</div>`;
    return;
  }
  const colores = ["#0b5cab", "#e08a1e", "#1f8a4c", "#8a97a3", "#c0392b"];
  const grupoAncho = series.length === 1 ? 40 : series.length * 18 + 6;
  const espacio = 20;
  const alturaMax = 200;
  const anchoSvg = fechas.length * (grupoAncho + espacio) + espacio;
  const altoSvg = alturaMax + 100;
  const max = Math.max(1, ...fechas.map(f => Math.max(...series.map(s => s.porFecha[f] || 0))));
  const anchoBarraIndiv = series.length === 1 ? grupoAncho : (grupoAncho - 6) / series.length;

  let barrasSvg = "";
  fechas.forEach((f, idx) => {
    const xGrupo = espacio + idx * (grupoAncho + espacio);
    series.forEach((s, si) => {
      const valor = s.porFecha[f] || 0;
      const x = xGrupo + si * (anchoBarraIndiv + (series.length > 1 ? 3 : 0));
      const alturaBarra = Math.max(1, (valor / max) * alturaMax);
      const y = alturaMax - alturaBarra + 20;
      barrasSvg += `<rect x="${x}" y="${y}" width="${anchoBarraIndiv}" height="${alturaBarra}" rx="3" fill="${colores[si % colores.length]}"></rect>`;
    });
    const xCentro = xGrupo + grupoAncho / 2;
    const yEtiqueta = alturaMax + 26;
    barrasSvg += `<text x="${xCentro}" y="${yEtiqueta}" text-anchor="end" font-size="9" fill="#5c6975" transform="rotate(-45 ${xCentro} ${yEtiqueta})">${formatearFechaDMA(f).slice(0,5)}</text>`;
  });
  const leyenda = series.length > 1 ? series.map((s, si) => `
    <span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;font-size:12px;color:#3d4a56;">
      <span style="width:10px;height:10px;border-radius:2px;background:${colores[si % colores.length]};display:inline-block;"></span>${s.nombre}
    </span>
  `).join("") : "";
  container.innerHTML = `
    <div style="overflow-x:auto;">
      <svg width="${anchoSvg}" height="${altoSvg}" viewBox="0 0 ${anchoSvg} ${altoSvg}">
        <line x1="${espacio-6}" y1="${alturaMax+20}" x2="${anchoSvg-4}" y2="${alturaMax+20}" stroke="#d7dee5" />
        ${barrasSvg}
      </svg>
    </div>
    ${leyenda ? `<div style="margin-top:8px;">${leyenda}</div>` : ""}
  `;
}

// Paleta categórica validada (orden fijo). El color sigue al equipo: al
// quitar uno de la selección, los demás conservan su color.
const PALETA_SERIES = ["#2a78d6","#eb6834","#1baf7a","#eda100","#e87ba4","#008300","#6250d6","#e34948"];
const MAX_LINEAS = 8;
const UMBRAL_PCT = 20;   // % de subida para marcar "Revisar"
const UMBRAL_M3 = 5;     // y al menos esta cantidad de m³
let resSemana = null;    // semana del resumen
let resBase = null;      // "equipos" o medidorNum (texto) de una medición diaria
let cmpRango = 12;       // últimas N semanas (0 = todas)
let cmpSeleccion = null; // [medidorNum] equipos en el gráfico comparativo
let cmpSlots = {};       // medidorNum -> posición en la paleta
let tablaTend = false;
let tablaCmp = false;

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
function fmtN(v, dec){
  if (v === null || v === undefined || isNaN(v)) return "—";
  const d = dec === undefined ? 1 : dec;
  return Number(v).toLocaleString("es-PE", { minimumFractionDigits: 0, maximumFractionDigits: d });
}
function datosKg(){ return kgGlobal || { embutidos: {}, empacado: {} }; }
function kgSem(clave, sem){
  const v = datosKg()[clave][sem];
  return v === undefined ? null : v;
}
function consumoDe(linea, sem){
  const p = linea.historial.find(x => x.semana === sem);
  return (p && p.consumo !== null) ? p.consumo : null;
}
function semanasConDatos(){
  const set = new Set();
  consumoGlobal.forEach(l => l.historial.forEach(p => { if (p.consumo !== null) set.add(p.semana); }));
  (consumoDiarioGlobal || []).forEach(l => l.historial.forEach(p => { if (p.consumo !== null) set.add(p.semana); }));
  const kg = datosKg();
  ["embutidos","empacado"].forEach(c => Object.keys(kg[c]).forEach(s => set.add(Number(s))));
  return Array.from(set).sort((a, b) => b - a);
}
function m3Equipos(sem){
  let t = 0, hay = false;
  consumoGlobal.forEach(l => { const c = consumoDe(l, sem); if (c !== null){ t += c; hay = true; } });
  return hay ? t : null;
}
function m3Diario(sem, medidorNum){
  const l = (consumoDiarioGlobal || []).find(x => x.medidorNum === medidorNum);
  let t = 0, d = 0;
  if (l) l.historial.forEach(p => { if (p.semana === sem && p.consumo !== null){ t += p.consumo; d++; } });
  return { m3: d ? t : null, dias: d };
}
function m3Base(sem){
  if (resBase === "equipos") return { m3: m3Equipos(sem), dias: null };
  return m3Diario(sem, Number(resBase));
}
function nombreBase(){
  if (resBase === "equipos") return "suma de equipos";
  const l = lineasDiarioGlobal.find(x => String(x.medidorNum) === resBase);
  return l ? l.nombre : "base";
}
function ratio(kg, m3){ return (kg !== null && m3 !== null && m3 > 0) ? kg / m3 : null; }
// subeEsBueno: true si que suba es mejor (kg/m³); false si es peor (consumo).
function variacion(act, prev, subeEsBueno){
  if (act === null || prev === null || prev === 0) return null;
  const pct = (act - prev) / prev * 100;
  if (Math.abs(pct) < 0.5) return { dir: "flat", pct: 0, bueno: null };
  return { dir: pct > 0 ? "up" : "down", pct, bueno: (pct > 0) === subeEsBueno };
}
function prepararResumen(){
  const sems = semanasConDatos();
  if (!sems.length) return false;
  if (resSemana === null || !sems.includes(resSemana)){
    const conEq = sems.find(s => m3Equipos(s) !== null);
    resSemana = conEq !== undefined ? conEq : sems[0];
  }
  const baseValida = resBase === "equipos" || lineasDiarioGlobal.some(l => String(l.medidorNum) === resBase);
  if (resBase === null || !baseValida){
    // Por defecto: el medidor de "Planta" si ya tiene consumos; si no, la suma de equipos.
    const pl = lineasDiarioGlobal.find(l => /planta/i.test(l.nombre));
    const plTiene = pl && (consumoDiarioGlobal || []).some(c => c.medidorNum === pl.medidorNum && c.historial.some(p => p.consumo !== null));
    resBase = plTiene ? String(pl.medidorNum) : "equipos";
  }
  if (cmpSeleccion === null){
    const ranking = consumoGlobal
      .map(l => ({ id: l.medidorNum, c: consumoDe(l, resSemana) }))
      .filter(x => x.c !== null)
      .sort((a, b) => b.c - a.c)
      .slice(0, 5);
    cmpSeleccion = ranking.map(x => x.id);
    cmpSlots = {};
    cmpSeleccion.forEach((id, i) => { cmpSlots[id] = i; });
  }
  return true;
}
function construirResumen(){

        </p>
        <div id="graficoTend"></div>

function activarResumen(){
  if (!document.getElementById("resumenCont")) return;
  document.getElementById("selResSemana").onchange = (e) => { resSemana = Number(e.target.value); refrescarResumen(); };
  document.getElementById("selResRango").onchange = (e) => { cmpRango = Number(e.target.value); refrescarResumen(); };
  document.getElementById("selResBase").onchange = (e) => { resBase = e.target.value; refrescarResumen(); };
  document.getElementById("btnTablaTend").onclick = () => { tablaTend = !tablaTend; dibujarTendencia(); };
  document.getElementById("btnTablaCmp").onclick = () => { tablaCmp = !tablaCmp; dibujarComparativo(); };
  refrescarResumen();

function refrescarResumen(){
  pintarKpis();
  pintarVariacion();
  dibujarTendencia();
  pintarChips();
  dibujarComparativo();
}
function semanasRango(){
  const todas = semanasConDatos().slice().sort((a, b) => a - b);
  return cmpRango > 0 ? todas.slice(-cmpRango) : todas;
}
/* --- Indicadores (tiles) --- */
function deltaHtml(v, sp){
  if (!v) return `<div class="kpi-delta sin">Sin semana ${sp} para comparar</div>`;
  const icono = v.dir === "up" ? "▲" : (v.dir === "down" ? "▼" : "●");
  const cls = v.bueno === null ? "neutro" : (v.bueno ? "bueno" : "malo");
  const txt = v.dir === "flat" ? "Sin cambio" : `${v.pct > 0 ? "+" : ""}${fmtN(v.pct, 1)}%`;
  return `<div class="kpi-delta"><span class="ic ${cls}">${icono}</span>${txt} vs semana ${sp}</div>`;
}
function tileHtml(etiqueta, valor, unidad, deltaStr, nota){
  return `
    <div class="kpi">
      <div class="et">${etiqueta}</div>
      <div class="val">${valor}${unidad ? `<span class="uni">${unidad}</span>` : ""}</div>
      ${deltaStr}
      <div class="nota">${nota}</div>
    </div>`;
}
function pintarKpis(){
  const s = resSemana, sp = s - 1;
  const base = m3Base(s), baseP = m3Base(sp);
  const esEq = resBase === "equipos";
  const tiles = [];

  tiles.push(tileHtml(
    `Consumo de agua — ${esc(nombreBase())}`,
    fmtN(base.m3, 1), base.m3 === null ? "" : "m³",
    deltaHtml(variacion(base.m3, baseP.m3, false), sp),
    base.m3 === null ? "Sin lecturas esa semana" : (esEq ? "Suma de todos los equipos" : `${base.dias}/7 días con lectura`)
  ));

  [["embutidos","Embutidos"],["empacado","Empacado"]].forEach(par => {
    const kg = kgSem(par[0], s), kgP = kgSem(par[0], sp);
    const r = ratio(kg, base.m3), rP = ratio(kgP, baseP.m3);
    let nota;
    if (kg === null) nota = "Falta registrar los kg de esta semana";
    else if (base.m3 === null) nota = "Falta el consumo de agua de esta semana";
    else nota = `${fmtN(kg, 0)} kg ÷ ${fmtN(base.m3, 1)} m³`;
    tiles.push(tileHtml(`Kg por m³ — ${par[1]}`, fmtN(r, 1), r === null ? "" : "kg/m³",
      deltaHtml(variacion(r, rP, true), sp), nota));
  });

  const eq = m3Equipos(s);
  if (!esEq){
    const cov = (eq !== null && base.m3 !== null && base.m3 > 0) ? eq / base.m3 * 100 : null;
    let nota = "Sin datos para comparar";
    if (cov !== null) nota = `Equipos: ${fmtN(eq, 1)} m³ de ${fmtN(base.m3, 1)} m³. ` + (cov > 100 ? "Supera 100%: revisar lecturas." : "El resto no tiene medidor propio.");
    tiles.push(tileHtml("Cobertura de equipos", fmtN(cov, 0), cov === null ? "" : "%", `<div class="kpi-delta sin">Equipos medidos vs ${esc(nombreBase())}</div>`, nota));
  }

  let top = null;
  consumoGlobal.forEach(l => { const c = consumoDe(l, s); if (c !== null && (top === null || c > top.c)) top = { l, c }; });
  if (top && eq > 0){
    tiles.push(tileHtml("Mayor consumidor (equipos)", fmtN(top.c / eq * 100, 0), "%",
      `<div class="kpi-delta sin">${fmtN(top.c, 1)} m³ en la semana</div>`, esc(`M${top.l.medidorNum} ${top.l.nombre}`)));
  }
  document.getElementById("resKpis").innerHTML = `<div class="kpi-grid">${tiles.join("")}</div>`;
}
/* --- Tabla de variación por equipo --- */
function pintarVariacion(){
  const s = resSemana, sp = s - 1;
  document.getElementById("tituloVar").textContent = `Variación por equipo — semana ${s} vs ${sp} (m³)`;
  const filas = [];
  consumoGlobal.forEach(l => {
    const a = consumoDe(l, s), b = consumoDe(l, sp);
    if (a === null && b === null) return;
    const delta = (a !== null && b !== null) ? a - b : null;
    const pct = (delta !== null && b > 0) ? delta / b * 100 : null;
    const revisar = delta !== null && pct !== null && delta >= UMBRAL_M3 && pct >= UMBRAL_PCT;
    filas.push({ nombre: `M${l.medidorNum} ${l.nombre}`, a, b, delta, pct, revisar });
  });
  filas.sort((x, y) => (y.delta === null ? -Infinity : y.delta) - (x.delta === null ? -Infinity : x.delta));

  const filasHtml = filas.map(f => {

        + (f.revisar ? `<span class="tag-rev">⚠ Revisar</span>` : "");
    }
    return `<tr><td>${esc(f.nombre)}</td><td>${fmtN(f.b, 1)}</td><td>${fmtN(f.a, 1)}</td><td>${varCelda}</td></tr>`;
  }).join("");
  cont.innerHTML = `
    <table class="tabla-var">
      <thead><tr><th>Equipo</th><th>Sem ${sp}</th><th>Sem ${s}</th><th>Variación</th></tr></thead>
      <tbody>${filasHtml}</tbody>
    </table>`;
}
/* --- Gráfico: kg por m³ por semana --- */
function dibujarTendencia(){

function pintarChips(){

function alternarEquipo(id){
  const aviso = document.getElementById("avisoCmp");
  aviso.textContent = "";
  if (cmpSeleccion.includes(id)){
    cmpSeleccion = cmpSeleccion.filter(x => x !== id);
    delete cmpSlots[id];
  }else{
    if (cmpSeleccion.length >= MAX_LINEAS){
      aviso.textContent = `Máximo ${MAX_LINEAS} equipos a la vez. Quita uno para agregar otro.`;
      return;
    }
    const usados = Object.values(cmpSlots);
    let slot = 0;
    while (usados.includes(slot)) slot++;
    cmpSlots[id] = slot;
    cmpSeleccion.push(id);
  }
  pintarChips();
  dibujarComparativo();
}
function dibujarComparativo(){

/* --- Gráfico de líneas genérico (SVG) con cursor y tooltip --- */
function escalaY(max){
  if (!(max > 0)) return { max: 1, paso: 0.25 };
  const bruto = max / 4;
  const mag = Math.pow(10, Math.floor(Math.log10(bruto)));
  const norm = bruto / mag;
  const paso = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
  return { paso, max: Math.ceil(max / paso - 1e-9) * paso };
}
function tablaLineChart(cfg){
  const wrap = document.createElement("div");
  wrap.className = "tabla-scroll";
  const t = document.createElement("table");
  t.className = "tabla-var";
  const thead = document.createElement("thead");
  const trh = document.createElement("tr");
  ["Semana"].concat(cfg.series.map(s => s.nombre)).forEach(txt => {
    const th = document.createElement("th");
    th.textContent = txt;
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  t.appendChild(thead);
  const tb = document.createElement("tbody");
  cfg.semanas.forEach((sem, i) => {
    const tr = document.createElement("tr");
    const td0 = document.createElement("td");
    td0.textContent = String(sem);
    tr.appendChild(td0);
    cfg.series.forEach(s => {
      const td = document.createElement("td");
      td.textContent = fmtN(s.valores[i], cfg.dec);
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  wrap.appendChild(t);
  return wrap;
}
function renderLineChart(cont, cfg){
  const { semanas, series } = cfg;
  const hayDatos = series.some(s => s.valores.some(v => v !== null));
  if (!semanas.length || !hayDatos){
    cont.innerHTML = `<div class="vacio" style="margin:10px 0;">No hay datos para mostrar todavía.</div>`;
    return;
  }
  if (cfg.tabla){
    cont.innerHTML = "";
    cont.appendChild(tablaLineChart(cfg));
    return;
  }
  const n = semanas.length;
  const ml = 44, mr = cfg.valoresFinales ? 48 : 16, mt = 14, mb = 30, H = 240;
  const W = Math.max(300, cont.clientWidth || 320, n * 46 + ml + mr);
  const pw = W - ml - mr, ph = H - mt - mb;
  let max = 0;
  series.forEach(s => s.valores.forEach(v => { if (v !== null && v > max) max = v; }));
  const esc_ = escalaY(max);
  const X = i => ml + (n === 1 ? pw / 2 : i * pw / (n - 1));
  const Y = v => mt + ph - (v / esc_.max) * ph;

  let g = "";
  for (let t = 0; t <= esc_.max + 1e-9; t += esc_.paso){
    g += `<line x1="${ml}" y1="${Y(t).toFixed(1)}" x2="${W - mr}" y2="${Y(t).toFixed(1)}" stroke="#e4e9ee" stroke-width="1"/>`;
    g += `<text x="${ml - 6}" y="${(Y(t) + 3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="#8a97a3">${fmtN(t, 2)}</text>`;
  }
  const salto = Math.max(1, Math.ceil(34 / (n > 1 ? pw / (n - 1) : pw)));
  semanas.forEach((s, i) => {
    if (i % salto !== 0 && i !== n - 1) return;
    if (i === n - 1 && i % salto !== 0 && (n - 1 - Math.floor((n - 1) / salto) * salto) < salto / 2) return;
    g += `<text x="${X(i).toFixed(1)}" y="${H - 10}" text-anchor="middle" font-size="10" fill="#5c6975">S${s}</text>`;
  });

  let lineas = "", puntos = "";
  series.forEach(s => {
    let d = "", pluma = false;
    s.valores.forEach((v, i) => {
      if (v === null){ pluma = false; return; }
      d += (pluma ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1) + " ";
      pluma = true;
    });
    lineas += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.valores.forEach((v, i) => {
      if (v === null) return;
      const aislado = (i === 0 || s.valores[i - 1] === null) && (i === n - 1 || s.valores[i + 1] === null);
      const ultimo = !s.valores.slice(i + 1).some(w => w !== null);
      if (n <= 14 || aislado || ultimo){
        puntos += `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="4" fill="${s.color}" stroke="#fff" stroke-width="2"/>`;
      }
    });
  });

  let etiquetas = "";
  if (cfg.valoresFinales){
    const fin = series.map(s => {
      let i = s.valores.length - 1;
      while (i >= 0 && s.valores[i] === null) i--;
      return i < 0 ? null : { i, v: s.valores[i], y: Y(s.valores[i]) };
    }).filter(Boolean).sort((a, b) => a.y - b.y);
    let ultimaY = -Infinity;
    fin.forEach(f => {
      if (f.y - ultimaY < 13) return;   // si chocan, se omite y queda el tooltip
      ultimaY = f.y;
      etiquetas += `<text x="${(X(f.i) + 9).toFixed(1)}" y="${(f.y + 4).toFixed(1)}" font-size="11" font-weight="700" fill="#1c2733">${fmtN(f.v, cfg.dec)}</text>`;
    });
  }

  const leyenda = (cfg.leyenda && series.length > 1)
    ? `<div class="lc-leyenda">${series.map(s => `<span><i class="k" style="background:${s.color}"></i>${esc(s.nombre)}</span>`).join("")}</div>` : "";
  const resumenA11y = `Gráfico de líneas, ${series.length} serie(s), semanas ${semanas[0]} a ${semanas[n - 1]}. Use las flechas para ver los valores.`;
  cont.innerHTML = `
    <div style="overflow-x:auto;">
      <div class="lc-wrap" style="width:${W}px;">
        <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" tabindex="0" role="img" aria-label="${esc(resumenA11y)}">
          ${g}${lineas}${puntos}${etiquetas}
          <line class="cur" x1="0" y1="${mt}" x2="0" y2="${mt + ph}" stroke="#8a97a3" stroke-width="1" style="display:none"/>
          <g class="hl"></g>
          <rect class="hit" x="${ml - 10}" y="${mt}" width="${pw + 20}" height="${ph + 6}" fill="transparent"/>
        </svg>
        <div class="lc-tip"></div>
      </div>
    </div>${leyenda}`;

  const svg = cont.querySelector("svg"), tip = cont.querySelector(".lc-tip");
  const cur = svg.querySelector(".cur"), hl = svg.querySelector(".hl"), hit = svg.querySelector(".hit");
  const NS = "http://www.w3.org/2000/svg";
  let idxActual = n - 1;
  function mostrar(i){
    idxActual = i;
    const xi = X(i);
    cur.setAttribute("x1", xi); cur.setAttribute("x2", xi); cur.style.display = "";
    hl.replaceChildren();
    tip.replaceChildren();
    const t = document.createElement("div");
    t.className = "t"; t.textContent = "Semana " + semanas[i];
    tip.appendChild(t);
    series.forEach(s => {
      const v = s.valores[i];
      if (v !== null){
        const c = document.createElementNS(NS, "circle");
        c.setAttribute("cx", xi); c.setAttribute("cy", Y(v)); c.setAttribute("r", 5);
        c.setAttribute("fill", s.color); c.setAttribute("stroke", "#fff"); c.setAttribute("stroke-width", 2);
        hl.appendChild(c);
      }
      const r = document.createElement("div"); r.className = "r";
      const k = document.createElement("span"); k.className = "k"; k.style.background = s.color;
      const val = document.createElement("span"); val.className = "v"; val.textContent = fmtN(v, cfg.dec) + (v === null ? "" : " " + cfg.unidad);
      const nom = document.createElement("span"); nom.className = "n"; nom.textContent = s.nombre;
      r.appendChild(k); r.appendChild(val); r.appendChild(nom);
      tip.appendChild(r);
    });
    tip.style.display = "block";
    const anchoTip = tip.offsetWidth;
    tip.style.left = (xi + 14 + anchoTip > W ? Math.max(0, xi - anchoTip - 14) : xi + 14) + "px";
  }
  function ocultar(){
    cur.style.display = "none"; hl.replaceChildren(); tip.style.display = "none";
  }
  function indiceDesde(ev){
    const rect = svg.getBoundingClientRect();
    const px = ev.clientX - rect.left;
    if (n === 1) return 0;
    return Math.max(0, Math.min(n - 1, Math.round((px - ml) / pw * (n - 1))));
  }
  hit.addEventListener("pointermove", ev => mostrar(indiceDesde(ev)));
  hit.addEventListener("pointerdown", ev => mostrar(indiceDesde(ev)));
  hit.addEventListener("pointerleave", ocultar);
  svg.addEventListener("focus", () => mostrar(idxActual));
  svg.addEventListener("blur", ocultar);
  svg.addEventListener("keydown", ev => {
    if (ev.key === "ArrowLeft"){ ev.preventDefault(); mostrar(Math.max(0, idxActual - 1)); }
    if (ev.key === "ArrowRight"){ ev.preventDefault(); mostrar(Math.min(n - 1, idxActual + 1)); }
  });
}
/* =========================================================
   ARRANQUE
========================================================= */
pintarReloj();
setInterval(pintarReloj, 20000);
irA("menu");
